# Docker Compose para levantar ÚNICAMENTE la base de datos MongoDB Atlas Local
# Uso independiente: cd modulo-c/database && docker compose up -d

version: '3.8'

services:
  atlas-local:
    image: mongodb/mongodb-atlas-local:latest
    container_name: atlas-local
    ports:
      - "27017:27017"
    volumes:
      - atlas_local_data:/data/db
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - medly-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  atlas_local_data:
    driver: local

networks:
  medly-network:
    name: medly-network

