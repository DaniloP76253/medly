server:
  port: 6001

spring:
  application:
    name: modulo-c-auditoria
  data:
    mongodb:
      # En Docker se reciben los tres miembros del Replica Set mediante MONGODB_URI.
      uri: ${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/medly_audit}}
      database: ${MONGODB_DATABASE:${SPRING_DATA_MONGODB_DATABASE:medly_audit}}

logging:
  level:
    root: INFO
    com.medly.moduloc: DEBUG
    org.springframework.data.mongodb: INFO
