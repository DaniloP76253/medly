# Red aislada: todos los módulos se comunican por nombre de servicio
networks:
  medly-net:
    driver: bridge


# Servicios

services:

  # Base de Datos Relacional - PostgreSQL 16
  db-relacional:
    image: postgres:16-alpine
    container_name: medly-db-relacional
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: citas_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - medly-net
    ports:
      - "5433:5432"           # Puerto alternativo del host; dentro de Docker sigue siendo 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d citas_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Módulo B - Servicio de Dominio (FastAPI / Python) | Puerto 5000
  # Solo accesible dentro de medly-net; modulo-a lo llama por hostname.
  modulo-b:
    build:
      context: ./modulo-b
      dockerfile: Dockerfile
    container_name: medly-modulo-b
    restart: unless-stopped
    environment:
      DB_HOST: db-relacional
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: citas_db
    ports:
      - "5000:5000"
    networks:
      - medly-net
    depends_on:
      db-relacional:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Módulo A - API Gateway (Node.js / Express) | Puerto 8080
  # Único punto de entrada público. Pertenece a medly-net para
  # resolver "modulo-b" y "modulo-c" por nombre de servicio DNS.
  modulo-a:
    build:
      context: ./modulo-a
      dockerfile: Dockerfile
    container_name: medly-modulo-a
    restart: unless-stopped
    environment:
      PORT: 8080
      MODULO_B_URL: http://modulo-b:5000
      MODULO_C_URL: http://modulo-c:6001/api/auditoria
    ports:
      - "8081:8080"           # Puerto del host; el servicio sigue usando 8080 dentro de Docker
    networks:
      - medly-net
    depends_on:
      modulo-b:
        condition: service_healthy
      modulo-c:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/citas').then(r => process.exit(r.status === 404 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Base de Datos NoSQL - MongoDB Atlas Local (Auditoría)
  atlas-local:
    image: mongodb/mongodb-atlas-local:latest
    container_name: medly-atlas-local
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - atlas_local_data:/data/db
      - atlas_local_config:/data/configdb
      - ./modulo-c/database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - medly-net
    healthcheck:
      test: ["CMD", "mongosh", "--host", "127.0.0.1", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Módulo C - Servicio de Trazabilidad y Auditoría (Spring Boot / Java) | Puerto 6000
  modulo-c:
    build:
      context: ./modulo-c
      dockerfile: Dockerfile
    container_name: medly-modulo-c
    restart: unless-stopped
    ports:
      - "6000:6001"
    environment:
      MONGODB_URI: mongodb://atlas-local:27017/medly_audit?directConnection=true
      MONGODB_DATABASE: medly_audit
    networks:
      - medly-net
    depends_on:
      atlas-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6001/api/auditoria/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

# Volúmenes persistentes
volumes:
  pgdata:
    driver: local
  atlas_local_data:
    driver: local
  atlas_local_config:
    driver: local