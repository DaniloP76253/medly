global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option redispatch
    retries 3
    timeout connect 2s
    timeout client 10s
    timeout server 10s

frontend medly_api
    bind *:8080
    default_backend gateways

backend gateways
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server gateway-a1 gateway-a1:8080 check inter 2s fall 3 rise 2
    server gateway-a2 gateway-a2:8080 check inter 2s fall 3 rise 2

